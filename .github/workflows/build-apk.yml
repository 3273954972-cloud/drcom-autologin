name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 刻意不用 android-actions/setup-android：它默认要装 'tools' 包，
      # 而新版 sdkmanager 已删除该包，会直接报 "Failed to find package 'tools'"。
      # ubuntu-latest runner 自带 Android SDK，ANDROID_HOME 已就位。
      - name: Show Android SDK location
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -1 "$ANDROID_HOME" || true
          ls -1 "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campusnet-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error